name: Padronizar public na branch correta

on:
  push:
    branches:
      - arrumando-menu-e-criando-efeito-dos-cards

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conectar CSS e JS globais apenas em public
        shell: python
        run: |
          from pathlib import Path

          root = Path("public")
          for page in sorted(root.glob("*.html")):
              data = page.read_text(encoding="utf-8")

              if 'href="gbm-pages.css"' not in data:
                  data = data.replace("</head>", '    <link rel="stylesheet" href="gbm-pages.css">\n</head>', 1)

              if 'src="gbm-pages.js"' not in data:
                  data = data.replace("</body>", '    <script src="gbm-pages.js"></script>\n</body>', 1)

              page.write_text(data, encoding="utf-8")

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          test -f public/gbm-pages.css
          test -f public/gbm-pages.js
          for page in public/*.html; do
            grep -Fq 'href="gbm-pages.css"' "$page"
            grep -Fq 'src="gbm-pages.js"' "$page"
          done
          echo "Padronizacao concluida somente em public/*.html"
          echo "public/guias nao foi processado."

      - name: Commitar e remover workflow temporario
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.html .github/workflows/padronizar-public-uma-branch.yml
          git rm -f .github/workflows/padronizar-public-uma-branch.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git commit -m "Padroniza paginas public na versao correta"
          git push origin HEAD:arrumando-menu-e-criando-efeito-dos-cards
