name: Apply global menu clean
on:
  push:
    branches:
      - fix/limite-gastos-canonical
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject menu script
        shell: python
        run: |
          from pathlib import Path
          public = Path('public')
          excluded = {'index.html','login.html','termos.html','privacidade.html','politica-de-privacidade.html','sobre.html','fale-conosco.html','offline.html','pagamento.html','assinatura.html','dashboard.html'}
          marker = '<script src="gbm-menu.js"></script>'
          changed=[]
          for path in sorted(public.glob('*.html')):
              if path.name.lower() in excluded:
                  continue
              text=path.read_text(encoding='utf-8')
              if marker in text or path.name=='limite-gastos.html':
                  if marker in text:
                      continue
              closing=text.lower().rfind('</body>')
              if closing<0:
                  continue
              path.write_text(text[:closing]+'    '+marker+'\n'+text[closing:],encoding='utf-8')
              changed.append(path.as_posix())
          print('Páginas atualizadas:',len(changed))
          print('\n'.join(changed))
      - name: Commit injected menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: habilitar menu global nas paginas internas [skip ci]"
          git push origin HEAD:fix/limite-gastos-canonical
