name: Padronizar public - versao correta

on:
  push:
    branches:
      - agent/padronizacao-visual-correta-2026-09

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar padronizacao
        shell: bash
        run: |
          set -euo pipefail
          test -f public/gbm-pages.css
          test -f public/gbm-pages.js
          for page in public/*.html; do
            [ -f "$page" ] || continue
            grep -Fq 'gbm-pages.css' "$page"
            grep -Fq 'gbm-pages.js' "$page"
          done
          echo "Validacao concluida: paginas de public conectadas aos arquivos globais." 
