name: Validar public - versao correta

on:
  pull_request:
    branches:
      - main
    paths:
      - 'public/**'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar arquivos globais
        shell: bash
        run: |
          set -euo pipefail
          test -f public/gbm-pages.css
          test -f public/gbm-pages.js
          echo "OK"
