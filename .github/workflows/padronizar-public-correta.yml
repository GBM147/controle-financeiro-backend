name: Validar public

on:
  pull_request:
    branches: [main]
    paths: ['public/**']

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          test -f public/gbm-pages.css
          test -f public/gbm-pages.js
          echo "Validacao OK"
