<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="gbm-session.js?v=94c6656885"></script>
    <meta charset="UTF-8">
    <title>Relatório Mensal | GBM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="vendor/jspdf-2.5.1.umd.min.js?v=98ccf17aa1"></script>
    <script src="vendor/jspdf-autotable-3.5.25.min.js?v=0216761340"></script>
    <link rel="stylesheet" href="paginas/relatorio-1.css?v=12c0f6c0e3">
    <link rel="stylesheet" href="gbm-tutorial.css">
    <link rel="stylesheet" href="gbm-pages.css?v=453f9c0c23">

    <link rel="stylesheet" href="paginas/relatorio-2.css?v=0790f9a1c3">
    <link rel="stylesheet" href="gbm-typography.css?v=4d6364e02a">
    <link rel="stylesheet" href="gbm-app-polish.css?v=9b9b068195">
    <link rel="stylesheet" href="gbm-motion.css?v=c80e92e4b3">
    <script src="gbm-motion.js?v=88bf99267f" defer></script>
    <link rel="stylesheet" href="gbm-interactions.css?v=39f271d94c">
    <script src="gbm-interactions.js?v=63cc46c496" defer></script>

    <script src="gbm-acoes.js?v=b9030c8ef0"></script>
</head>
<body class="gbm-interna gbm-polished">
<canvas id="particles-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;"></canvas>
<header class="gbm-header">
    <div class="gbm-logo-container">
        <img src="logo-transparente.jpg" alt="Logo GBM" class="gbm-logo-img">
        <h1 class="gbm-title">Guardian Of Budget & Money</h1>
    </div>
    <a href="dashboard.html" class="btn-voltar">Voltar</a>
</header>

<div class="page-wrapper">

    <div class="card">
        <div class="filtros">
            <select id="mes-ref" aria-label="Mês do relatório">
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
            <input type="number" id="ano-ref" aria-label="Ano do relatório" value="2026">
            <select id="banco-ref" aria-label="Banco do relatório">
                <option value="todos">Todos os bancos</option>
            </select>
            <button class="btn-acao btn-gerar" data-acao="gerarRelatorio">Gerar Relatório</button>
            <button class="btn-acao btn-pdf"   data-acao="baixarPDF">Baixar PDF</button>
        </div>
    </div>

    <div class="card" id="card-resultado">
        <div id="resultado-relatorio">
            <p class="texto-vazio">Escolha o mês e o ano e clique em "Gerar Relatório".</p>
        </div>
    </div>
</div>
<!-- MODAL EDITAR CATEGORIA -->
<div class="modal-overlay" id="modal-categoria">
    <div class="modal-box">
        <h3>Alterar Categoria</h3>
        <p class="modal-desc" id="modal-desc-tx"></p>
        <select id="modal-select-cat">
            <option>Alimentação</option>
            <option>Habitação</option>
            <option>Transporte</option>
            <option>Eletricidade / Luz</option>
            <option>Telecomunicações / Internet</option>
            <option>Pagamento de Fatura</option>
            <option>Pagamento de Boleto</option>
            <option>Streaming de Vídeo</option>
            <option>Streaming de Música</option>
            <option>Academia e Fitness</option>
            <option>Saúde</option>
            <option>Educação</option>
            <option>Supermercado</option>
            <option>Restaurantes</option>
            <option>Salário</option>
            <option>Lazer</option>
            <option>Transferência</option>
            <option>Taxas Bancárias</option>
            <option>Entretenimento</option>
            <option>Igreja / Doações</option>
            <option>Outros</option>
        </select>
        <div class="modal-acoes">
            <button class="btn-cancelar" data-acao="fecharModal">Cancelar</button>
            <button class="btn-confirmar" data-acao="salvarCategoria">Salvar</button>
        </div>
    </div>
</div>
<script src="auth.js?v=6f32663332"></script>
    <script src="paginas/relatorio-1.js?v=981e0c7b6b"></script>

    <!-- MODAL DE NOTIFICAÇÕES GBM -->
    <div id="modal-notificacoes" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); z-index:99999; align-items:center; justify-content:center;">
        <div style="background:#0f1a2b; border:1px solid rgba(95,255,168,0.3); border-radius:16px; padding:30px; max-width:460px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.7);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <img src="logo-transparente.jpg" alt="GBM" style="height:28px;">
                    <span style="font-family:'Sora',sans-serif; font-size:1.2rem; font-weight:700; letter-spacing:2px; color:#5fffa8;">GBM — NOTIFICAÇÕES</span>
                </div>
                <button data-acao="fecharModalNotificacoes" data-args="[false]" style="background:none; border:none; color:#b0bec5; font-size:1.5rem; cursor:pointer; line-height:1;">&times;</button>
            </div>
            <div id="lista-notificacoes-modal"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button id="btn-confirmar-modal" data-acao="fecharModalNotificacoes" data-args="[true]" style="display:none; flex:1; padding:12px; background:#2E8B57; color:#fff; border:none; border-radius:8px; font-family:'Sora',sans-serif; font-size:1rem; font-weight:700; letter-spacing:1px; cursor:pointer; transition:0.2s;" data-fundo-hover="#246e45" data-fundo-normal="#2E8B57">CONFIRMAR</button>
                <button id="btn-fechar-modal" data-acao="fecharModalNotificacoes" data-args="[false]" style="flex:1; padding:12px; background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:8px; font-family:'Sora',sans-serif; font-size:1rem; font-weight:700; letter-spacing:1px; cursor:pointer; transition:0.2s;" data-fundo-hover="rgba(255,255,255,0.15)" data-fundo-normal="rgba(255,255,255,0.08)">FECHAR</button>
            </div>
        </div>
    </div>
<script src="paginas/relatorio-2.js?v=74d39001cc"></script>
    <script src="gbm-tutorial.js"></script>
    <script src="gbm-menu.js?v=56467e5b3d"></script>
    <script src="gbm-pages.js?v=b53b3cd6b3"></script>
</body>
</html>
