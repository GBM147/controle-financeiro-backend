<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="gbm-session.js?v=94c6656885"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Limite de Gastos | GBM</title>
    <link rel="stylesheet" href="gbm-pages.css?v=453f9c0c23">
    <link rel="stylesheet" href="paginas/limite-de-gastos.css?v=9f406ca8af">
    <link rel="stylesheet" href="gbm-tutorial.css">
    <link rel="stylesheet" href="gbm-typography.css?v=4d6364e02a">
    <link rel="stylesheet" href="gbm-app-polish.css?v=9b9b068195">
    <link rel="stylesheet" href="gbm-motion.css?v=c80e92e4b3">
    <script src="gbm-motion.js?v=88bf99267f" defer></script>
    <link rel="stylesheet" href="gbm-interactions.css?v=39f271d94c">
    <script src="gbm-interactions.js?v=63cc46c496" defer></script>
    <link rel="icon" href="/logo-transparente.png" type="image/png">
    <script src="gbm-acoes.js?v=b9030c8ef0"></script>
</head>
<body class="gbm-interna gbm-polished">
    <header class="topbar">
        <a class="brand" href="dashboard.html" aria-label="Ir para o dashboard"><img src="logo-transparente.jpg" alt="GBM"><span>Guardian of Budget & Money</span></a>
        <a class="btn-voltar" href="dashboard.html" aria-label="Voltar ao Dashboard">Voltar</a>
    </header>
    <main class="container">
        <div class="page-title">
            <h1>Limite de gastos</h1>
            <p>Defina limites mensais por categoria e escolha em quais percentuais quer ser avisado.</p>
        </div>

        <section class="card">
            <h2>Definir ou ajustar limite</h2>
            <div class="form-limite" id="form-limite">
                <div class="field">
                    <label for="nova-meta-cat">Categoria</label>
                    <select id="nova-meta-cat">
                        <option value="" selected disabled>Selecione...</option>
                        <option>Alimentação</option><option>Habitação</option><option>Transporte</option>
                        <option>Eletricidade / Luz</option><option>Telecomunicações / Internet</option>
                        <option>Pagamento de Fatura</option><option>Pagamento de Boleto</option>
                        <option>Streaming de Vídeo</option><option>Streaming de Música</option>
                        <option>Academia e Fitness</option><option>Saúde</option><option>Educação</option>
                        <option>Supermercado</option><option>Restaurantes</option><option>Lazer</option><option>Outros</option>
                    </select>
                </div>
                <div class="field">
                    <label for="nova-meta-valor">Limite mensal</label>
                    <input type="number" id="nova-meta-valor" min="0.01" step="0.01" placeholder="R$ 0,00">
                </div>
                <div class="percentuais">
                    <label class="field" style="display:block">
                        <span style="color:var(--muted);font-size:.78rem;font-weight:600">Quando você quer ser avisado?</span>
                        <span class="percentual-row" style="margin-top:7px">
                            <input type="number" id="novo-percentual" min="1" max="100" step="1" placeholder="Ex.: 50">
                            <button type="button" class="btn btn-purple" data-acao="adicionarPercentual">Adicionar</button>
                        </span>
                    </label>
                    <div id="chips" class="chips"></div>
                    <p class="dica">Você pode criar vários avisos, como 50%, 70% e 90%. Cada percentual será avisado apenas uma vez por mês.</p>
                </div>
                <div class="field full"><div class="actions end"><button id="btn-salvar" class="btn btn-primary" data-acao="salvarNovoLimite">Salvar limite</button></div></div>
            </div>
        </section>

        <div id="editor-container" class="lista-metas"><div class="empty">Carregando...</div></div>
    </main>
    <script src="auth.js?v=6f32663332"></script>
    <script src="gbm-pages.js?v=b53b3cd6b3"></script>
    <script src="paginas/limite-de-gastos.js?v=8ca93f1181"></script>
    <script src="gbm-tutorial.js"></script>
    <script src="gbm-menu.js?v=56467e5b3d"></script>
</body>
</html>
