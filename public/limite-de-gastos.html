<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMITE DE GASTOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#26874E;--azul:#55a7ff;--vermelho:#ef4444;--texto:#fff;--mutado:#b0bec5;--borda:rgba(255,255,255,.12);--card:#0f1a2b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--texto);font-family:Inter,sans-serif;background:linear-gradient(rgba(15,23,42,.86),rgba(15,23,42,.92)),url('fundo-marmore.jpg') center/cover fixed}
.gbm-header{height:74px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--borda);background:rgba(7,17,31,.3);backdrop-filter:blur(9px);position:sticky;top:0;z-index:10}
.gbm-logo-container{display:flex;align-items:center;gap:15px}.gbm-logo-img{height:58px;width:auto;border-radius:8px}.gbm-title{margin:0;font:700 26px Rajdhani,sans-serif;letter-spacing:2px;background:linear-gradient(90deg,#2E8B57,#5fffa8,#3d28ff,#655aff,#2E8B57);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite}@keyframes shine{to{background-position:200% center}}
.btn-voltar{color:#fff;text-decoration:none;font:700 15px Rajdhani,sans-serif;padding:9px 14px;border-radius:8px;border:1px solid rgba(85,167,255,.25);background:rgba(15,26,43,.7)}.btn-voltar:hover{border-color:var(--azul);color:#9dcbff}
.page-wrapper{max-width:1120px;margin:auto;padding:24px 27px 72px}.titulo{margin:0 0 24px;font:700 clamp(1.8rem,3.5vw,2.4rem) Rajdhani,sans-serif;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:16px}
.card{background:rgba(15,26,43,.96);border:1px solid rgba(85,167,255,.2);border-radius:17px;padding:24px;box-shadow:0 14px 34px rgba(0,0,0,.42);position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(85,167,255,.4),transparent)}.card h2{margin:0 0 22px;font:700 1.15rem Inter,sans-serif}
.form{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.1)}.campo{display:flex;flex-direction:column;gap:7px}.campo label{font-size:.78rem;color:var(--mutado);font-weight:600}.campo select,.campo input{width:100%;min-height:44px;padding:10px 12px;border:1px solid rgba(255,255,255,.11);border-radius:10px;background:rgba(12,27,45,.86);color:#fff;outline:none}.campo select:focus,.campo input:focus{border-color:rgba(85,167,255,.65);box-shadow:0 0 0 3px rgba(85,167,255,.11)}.percentuais{grid-column:1/-1;padding:14px;border:1px solid rgba(85,167,255,.13);border-radius:10px;background:rgba(20,34,57,.72)}.percentual-row{display:flex;gap:9px;max-width:340px}.percentual-row input{max-width:190px}.btn{min-height:44px;padding:9px 16px;border:0;border-radius:8px;background:var(--verde);color:#fff;font-weight:700;cursor:pointer}.btn:hover{background:#319f6b}.btn-sec{min-height:44px;padding:9px 14px;border:1px solid rgba(85,167,255,.35);border-radius:8px;background:rgba(85,167,255,.08);color:#b7d8f6;font-weight:700;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(95,255,168,.3);border-radius:999px;background:rgba(38,135,78,.12);color:#8dffc1;font-size:.78rem;font-weight:700}.chip button{width:20px;height:20px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}.dica{margin:7px 0 0;color:var(--mutado);font-size:.72rem;line-height:1.45}.acoes{grid-column:1/-1;display:flex;justify-content:flex-end}
.lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.meta{padding:19px;border:1px solid rgba(85,167,255,.15);border-radius:13px;background:rgba(20,34,57,.86)}.meta-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:700 1rem Rajdhani,sans-serif}.barra{height:10px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.08)}.barra div{height:100%;border-radius:inherit;transition:width .3s}.rodape{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:var(--mutado);font-size:.82rem}.alertas{margin-top:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.editar{padding:7px 12px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer}.editar:hover{border-color:rgba(85,167,255,.5);color:#9dcbff}.vazio{text-align:center;color:var(--mutado);padding:20px;grid-column:1/-1}
#toast{position:fixed;right:22px;bottom:22px;z-index:99999;display:none;max-width:420px;padding:14px 18px;border-radius:10px;background:#0f1a2b;border:1px solid rgba(95,255,168,.35);box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:.9rem}#toast.erro{border-color:rgba(239,68,68,.5)}#toast.aviso{border-color:rgba(85,167,255,.5)}
@media(max-width:760px){.gbm-header{height:62px;padding:0 15px}.gbm-title{display:none}.page-wrapper{padding:20px 15px 56px}.form,.lista{grid-template-columns:1fr}.percentuais,.acoes{grid-column:1}.acoes{justify-content:stretch}.acoes .btn{width:100%}}
</style>
</head>
<body>
<canvas id="particles" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none"></canvas>
<header class="gbm-header"><div class="gbm-logo-container"><img src="logo-transparente.jpg" class="gbm-logo-img" alt="Logo GBM"><h1 class="gbm-title">Guardian Of Budget &amp; Money</h1></div><a href="dashboard.html" class="btn-voltar">Voltar</a></header>
<main class="page-wrapper">
<h2 class="titulo">Limite de gastos</h2>
<section class="card">
<h2>Definir ou ajustar limite</h2>
<div class="form" id="form-limite">
<div class="campo"><label for="nova-meta-cat">Categoria</label><select id="nova-meta-cat"><option value="" selected disabled>Selecione...</option><option>Alimentação</option><option>Habitação</option><option>Transporte</option><option>Eletricidade / Luz</option><option>Telecomunicações / Internet</option><option>Pagamento de Fatura</option><option>Pagamento de Boleto</option><option>Streaming de Vídeo</option><option>Streaming de Música</option><option>Academia e Fitness</option><option>Saúde</option><option>Educação</option><option>Supermercado</option><option>Restaurantes</option><option>Lazer</option><option>Outros</option></select></div>
<div class="campo"><label for="nova-meta-valor">Limite mensal</label><input type="number" id="nova-meta-valor" min="0.01" step="0.01" placeholder="R$ 0,00"></div>
<div class="percentuais"><label class="campo" style="display:block"><span style="color:var(--mutado);font-size:.78rem;font-weight:600">Quando você quer ser avisado?</span><span class="percentual-row" style="margin-top:7px"><input type="number" id="novo-percentual" min="1" max="100" step="1" placeholder="Ex.: 50"><button type="button" class="btn-sec" onclick="adicionarPercentual()">+ Adicionar</button></span></label><div id="chips" class="chips"></div><p class="dica">Você pode criar vários avisos, como 50%, 70% e 90%. Cada percentual será avisado apenas uma vez por mês.</p></div>
<div class="acoes"><button id="btn-salvar" class="btn" onclick="salvarNovoLimite()">Salvar limite</button></div>
</div>
<div id="editor-container" class="lista"></div>
</section>
</main><div id="toast"></div>
<script src="auth.js"></script>
<script>
let percentuaisSelecionados=[50,70],metasCarregadas=[];const userId=localStorage.getItem('userIdAtual')||sessionStorage.getItem('userIdAtual');if(!userId)location.href='index.html';
function alerta(msg,tipo='info'){const el=document.getElementById('toast');el.textContent=msg;el.className=tipo;el.style.display='block';clearTimeout(alerta.timer);alerta.timer=setTimeout(()=>el.style.display='none',3500)}
function norm(v){return [...new Set((Array.isArray(v)?v:[]).map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=100))].sort((a,b)=>a-b)}
function renderChips(){document.getElementById('chips').innerHTML=percentuaisSelecionados.map(p=>`<span class="chip">${p}%<button type="button" onclick="removerPercentual(${p})">×</button></span>`).join('')}
function adicionarPercentual(){const i=document.getElementById('novo-percentual'),p=Number(i.value);if(!Number.isInteger(p)||p<1||p>100)return alerta('Digite um percentual inteiro entre 1% e 100%.','aviso');percentuaisSelecionados=norm([...percentuaisSelecionados,p]);i.value='';renderChips();i.focus()}
function removerPercentual(p){percentuaisSelecionados=percentuaisSelecionados.filter(v=>v!==p);renderChips()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function editarLimite(i){const m=metasCarregadas[i];if(!m)return;const s=document.getElementById('nova-meta-cat');if(![...s.options].some(o=>o.value===m.categoria))s.add(new Option(m.categoria,m.categoria));s.value=m.categoria;document.getElementById('nova-meta-valor').value=Number(m.limite||0).toFixed(2);percentuaisSelecionados=norm(m.percentuais_alerta);renderChips();document.getElementById('form-limite').scrollIntoView({behavior:'smooth',block:'center'})}
async function carregarEditor(){try{const r=await fetchApi('/metas-resumo?userId='+encodeURIComponent(userId));const j=await r.json();if(!r.ok)throw Error(j.error||'Falha ao carregar limites.');let metas=j.data||[];metasCarregadas=metas.filter(m=>m.categoria);const c=document.getElementById('editor-container');if(!metasCarregadas.length){c.innerHTML='<div class="vazio">Você ainda não definiu limites. Use o formulário acima para criar o primeiro.</div>';return}c.innerHTML=metasCarregadas.map((m,i)=>{const limite=Number(m.limite)||0,gasto=Number(m.gasto)||0,p=limite>0?gasto/limite*100:0,w=Math.min(p,100),cor=p<75?'var(--verde)':p<100?'var(--azul)':'var(--vermelho)',ps=norm(m.percentuais_alerta);return `<article class="meta"><div class="meta-head"><strong>${esc(m.categoria)}</strong><strong style="color:${cor}">${p.toFixed(1)}%</strong></div><div class="barra"><div style="width:${w}%;background:${cor}"></div></div><div class="rodape"><span>R$ ${gasto.toFixed(2)} de R$ ${limite.toFixed(2)}</span><span>Gasto</span></div><div class="alertas"><div><span style="font-size:.75rem;color:var(--mutado)">Avisos configurados</span><div class="chips">${ps.map(x=>`<span class="chip">${x}%</span>`).join('')}</div></div><button class="editar" onclick="editarLimite(${i})">Editar</button></div></article>`}).join('')}catch(e){console.error(e);document.getElementById('editor-container').innerHTML='<div class="vazio" style="color:var(--vermelho)">Não foi possível carregar os limites.</div>';alerta(e.message,'erro')}}
async function salvarNovoLimite(){const categoria=document.getElementById('nova-meta-cat').value,valor_limite=Number(document.getElementById('nova-meta-valor').value),percentuais_alerta=norm(percentuaisSelecionados);if(!categoria||!Number.isFinite(valor_limite)||valor_limite<=0)return alerta('Selecione uma categoria e informe um limite maior que zero.','aviso');if(!percentuais_alerta.length)return alerta('Adicione pelo menos um percentual de aviso.','aviso');const b=document.getElementById('btn-salvar');b.disabled=true;b.textContent='Salvando...';try{const r=await fetchApi('/atualizar-meta-alerta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({categoria,valor_limite,percentuais_alerta})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro ao gravar o limite no servidor.');document.getElementById('nova-meta-cat').value='';document.getElementById('nova-meta-valor').value='';percentuaisSelecionados=[50,70];renderChips();await carregarEditor();alerta('Limite e avisos salvos com sucesso!')}catch(e){console.error(e);alerta(e.message,'erro')}finally{b.disabled=false;b.textContent='Salvar limite'}}
document.getElementById('novo-percentual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();adicionarPercentual()}});renderChips();carregarEditor();
(function(){const c=document.getElementById('particles'),x=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',r);r();const p=Array.from({length:Math.min(65,Math.floor(innerWidth*innerHeight/15000))},()=>({x:Math.random()*c.width,y:Math.random()*c.height,s:Math.random()*2+.7,v:Math.random()*.9+.25,o:Math.random()*.35+.15}));(function a(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.y-=q.v;if(q.y<0)q.y=c.height;x.fillStyle=`rgba(85,167,255,${q.o})`;x.beginPath();x.arc(q.x,q.y,q.s,0,Math.PI*2);x.fill()});requestAnimationFrame(a)})()})();
</script>
</body></html>
