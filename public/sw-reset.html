<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperando GBM Finance</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#060a12;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.box{text-align:center;padding:32px;max-width:520px}.box h1{font-size:22px}.box p{color:#b0bec5;line-height:1.5}
</style>
</head>
<body>
<div class="box"><h1>Atualizando o GBM Finance...</h1><p>Removendo o componente antigo e carregando a versão atual.</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('gbm-estatico-')).map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('/sw.js?v=1.1.48',{scope:'/',updateViaCache:'none'});
      await reg.update().catch(()=>{});
    }
  }catch(e){ console.warn('Recuperação do Service Worker:',e); }
  location.replace('/index.html?sw-reset=1');
})();
</script>
</body>
</html>
