<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="gbm-tema.js?v=69a291f638"></script>
    <script src="gbm-session.js?v=94c6656885"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | GBM</title>
    <link rel="icon" href="/logo-transparente.png" type="image/png">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="estilo/tokens.css?v=88606937b0">
    <link rel="stylesheet" href="estilo/base.css?v=3532b91c9f">
    <link rel="stylesheet" href="estilo/componentes.css?v=9de4968b17">
    <link rel="stylesheet" href="estilo/app.css?v=34eeeb0506">
    <link rel="stylesheet" href="gbm-tutorial.css">
    <link rel="stylesheet" href="paginas/perfil.css?v=380067678d">
    <script src="gbm-movimento.js?v=35d40620e7"></script>
</head>
<body class="gbm-interna">
    <header class="topbar">
        <a class="brand" href="dashboard.html" aria-label="Ir para o Dashboard">
            <img src="logo-transparente.jpg" alt="Logo GBM">
            <span>Guardian of Budget &amp; Money</span>
        </a>
        <div class="top-actions">
            <a class="btn-voltar" href="configuracoes.html" aria-label="Voltar às Configurações">Voltar</a>
        </div>
    </header>

    <main>
        <section class="perfil-card" aria-labelledby="titulo-perfil">
            <div id="capa-perfil" class="capa">
                <div class="trocar-capa">
                    <label class="input-file-label" for="input-capa">Alterar capa</label>
                    <input id="input-capa" type="file" accept="image/png,image/jpeg,image/webp">
                </div>
            </div>

            <div class="conteudo">
                <div class="avatar-area">
                    <img id="foto-perfil" class="avatar" src="logo-transparente.jpg" alt="Foto de perfil">
                    <div class="avatar-acoes">
                        <label class="input-file-label" for="input-foto">Alterar foto</label>
                        <input id="input-foto" type="file" accept="image/png,image/jpeg,image/webp">
                    </div>
                </div>

                <h1 id="titulo-perfil">Meu perfil</h1>
                <p class="subtitulo">Personalize como seu perfil aparece no GBM.</p>

                <label for="nome-exibicao">Nome exibido</label>
                <input id="nome-exibicao" type="text" maxlength="100" placeholder="Nome ou apelido que aparece no GBM">

                <div class="acoes">
                    <button id="btn-salvar" class="btn btn-principal" type="button">Salvar perfil</button>
                </div>
                <p id="mensagem" role="status"></p>
            </div>
        </section>
    </main>

    <script src="auth.js?v=89cc681816"></script>
    <script src="paginas/perfil.js?v=40315f2295"></script>
    <script src="gbm-pages.js?v=90bf95391f"></script>
    <script src="gbm-tutorial.js"></script>
    <script src="gbm-menu.js?v=f9b5ac2353"></script>
</body>
</html>
