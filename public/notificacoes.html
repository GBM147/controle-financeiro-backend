<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="gbm-tema.js?v=69a291f638"></script>
    <script src="gbm-session.js?v=94c6656885"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notificações | GBM</title>
    <link rel="icon" href="/logo-transparente.png" type="image/png">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="estilo/tokens.css?v=88606937b0">
    <link rel="stylesheet" href="estilo/base.css?v=3532b91c9f">
    <link rel="stylesheet" href="estilo/componentes.css?v=9de4968b17">
    <link rel="stylesheet" href="estilo/app.css?v=34eeeb0506">
    <link rel="stylesheet" href="gbm-tutorial.css">
    <link rel="stylesheet" href="paginas/notificacoes.css?v=40f1ef1737">
    <script src="gbm-movimento.js?v=35d40620e7"></script>
</head>
<body class="gbm-interna">
    <header class="topbar">
        <a class="brand" href="dashboard.html"><img src="logo-transparente.jpg" alt="GBM"><span>Guardian of Budget & Money</span></a>
        <a class="btn-voltar" href="dashboard.html" aria-label="Voltar ao Dashboard">Voltar</a>
    </header>
    <main class="container">
        <div class="page-title">
            <h1>Central de notificações</h1>
            <p>Consulte alertas anteriores e escolha como deseja receber os próximos avisos.</p>
        </div>
        <div class="grid grid-3">
            <section class="card notificacoes-lista">
                <div class="notificacoes-filtros">
                    <div class="actions">
                        <select id="filtro-status" aria-label="Status das notificações">
                            <option value="todas">Todas</option>
                            <option value="nao_lidas">Não lidas</option>
                            <option value="lidas">Lidas</option>
                        </select>
                        <select id="filtro-tipo" aria-label="Tipo de notificação">
                            <option value="todos">Todos os tipos</option>
                            <option value="limite">Limites</option>
                            <option value="sistema">Sistema</option>
                        </select>
                    </div>
                    <button id="marcar-todas" class="btn btn-small">Marcar todas como lidas</button>
                </div>
                <div class="divider"></div>
                <div id="lista-notificacoes"><div class="empty">Carregando...</div></div>
            </section>
            <aside class="card">
                <h2>Preferências</h2>
                <label class="switch-row"><span>Avisos no site</span><input id="pref-site" type="checkbox"></label>
                <label class="switch-row"><span>Avisos por e-mail</span><input id="pref-email" type="checkbox"></label>
                <div class="divider"></div>
                <div class="field"><label for="pref-inicio">Silenciar a partir de</label><input id="pref-inicio" type="time"></div>
                <div class="field"><label for="pref-fim">Até</label><input id="pref-fim" type="time"></div>
                <button id="salvar-preferencias" class="btn btn-primary btn-bloco">Salvar preferências</button>
            </aside>
        </div>
    </main>
    <script src="auth.js?v=89cc681816"></script><script src="gbm-pages.js?v=90bf95391f"></script>
    <script src="paginas/notificacoes.js?v=136ebfd566"></script>
    <script src="gbm-tutorial.js"></script>
    <script src="gbm-menu.js?v=f9b5ac2353"></script>
</body>
</html>
