<body class="gbm-interna">

<div class="page-wrapper">
    <div class="page-title">
        <h1>Comparativo mensal</h1>
        <p>Entradas e saídas de cada mês do ano, lado a lado, com o mês mais econômico em destaque.</p>
    </div>
    <div class="card">
        <div class="filtros">
            <div class="campo-filtro">
                <label for="ano-ref">Ano de referência</label>
                <select id="ano-ref"></select>
            </div>
            <div class="campo-filtro">
                <label for="tipo-grafico-comparativo">Tipo de gráfico</label>
                <select id="tipo-grafico-comparativo" data-acao-change="trocarTipoGraficoComparativo">
                    <option value="bar">Barras agrupadas</option>
                    <option value="line">Linhas</option>
                    <option value="radar">Radar</option>
                </select>
            </div>
            <button class="btn-acao btn-primario btn-gerar" data-acao="carregarComparativo">Atualizar</button>
        </div>
    </div>

    <div class="card" id="card-resultado">
        <div id="resultado-comparativo">
            <p class="texto-vazio">Carregando...</p>
        </div>
    </div>
</div>
